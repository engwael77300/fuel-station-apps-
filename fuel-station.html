<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>إدارة محطة الوقود</title><meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Tajawal,system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:16px}
label{display:block;font-size:13px;color:var(--mu);flex:1}
input,select{width:100%;margin-top:3px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:8px;margin-bottom:8px}
.nz{display:grid;grid-template-columns:62px 1fr 1fr 70px;gap:6px;align-items:end;padding:6px 0;border-top:1px dashed var(--bd)}
.nz input{padding:8px 6px}.lt{font-weight:700;text-align:left;padding-bottom:8px;font-variant-numeric:tabular-nums}
.mh{margin-top:8px;font-weight:700}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:8px 0}
.ck{display:flex;align-items:center;gap:6px;color:var(--tx);font-size:14px;padding:6px 0}.ck input{width:auto;margin:0}
.b{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;color:var(--on)}.b.p{background:var(--pt)}.b.d{background:var(--ds)}
button{font:inherit;cursor:pointer}
.pri{width:100%;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--on);font-weight:700;margin-bottom:6px}
.ok{background:var(--pt)}
.lk{background:none;border:0;color:var(--ac);padding:6px 0;margin-bottom:6px;font-weight:700}
.x{background:none;border:0;color:var(--rd);font-size:18px;padding:0 6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-variant-numeric:tabular-nums}
.li:first-of-type{border-top:0}
.tap{cursor:pointer}.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.neg{color:var(--rd)}small{color:var(--mu)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-bottom:6px}
th,td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mu);font-weight:400}.tt td{font-weight:700;border-bottom:0}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:8px;font-weight:700}.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tw{overflow-x:auto}.ac{white-space:nowrap}td small{white-space:nowrap}tr.tap{cursor:pointer}tr[hidden]{display:none}
.ban{font-size:15px}.ban.g{border-color:var(--pt);color:var(--pt)}.ban.r{border-color:var(--rd);color:var(--rd)}.ban.w{border-color:var(--ds);color:var(--ds)}
#pdf{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;direction:rtl;font:15px/1.5 Tajawal,system-ui,sans-serif;--cd:#fff;--tx:#111;--mu:#555;--bd:#c9d1d5;--pt:#0b7a4b;--ds:#a86a00;--ac:#0f4c5c;--on:#fff;--rd:#b42318}
#pdf .pb{background:#fff;padding:5px 0}#pdf .card{margin:0;border-radius:6px}
#pdf .ph{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid #0f4c5c;padding:6px 0 12px;margin-bottom:6px}
#pdf .st{font-size:28px;font-weight:700;color:#0f4c5c}#pdf .tl{font-size:18px}#pdf .qb{background:#fff;padding:4px}
#pdf .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#pdf .kp div{border:1px solid #c9d1d5;border-radius:6px;padding:8px 10px;font-variant-numeric:tabular-nums}#pdf .kp b{font-size:20px}
#pdf .sg{display:flex;gap:48px;margin-top:40px}#pdf .sg div{flex:1;border-top:1px solid #111;padding-top:6px;text-align:center;font-size:14px}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;align-items:center;gap:10px;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px}
#hd button{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:20px;padding:2px 10px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cd)}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.dr{position:fixed;top:0;bottom:0;right:0;width:min(290px,84vw);background:var(--cd);border-left:1px solid var(--bd);z-index:31;transform:translateX(100%);visibility:hidden;transition:transform .2s;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
body.dro .bk{opacity:1;pointer-events:auto}body.dro .dr{transform:none;visibility:visible}
.dr .it{text-align:right;padding:12px;border:0;background:none;color:var(--tx);border-radius:8px;font-weight:700}.dr .it.on{background:var(--bg);color:var(--ac)}
@media(prefers-reduced-motion:reduce){.bk,.dr{transition:none}}
#pdf{width:760px;font-size:12.5px;line-height:1.4}#pdf .pb{padding:3px 0}#pdf .card{padding:7px 9px;margin:0}#pdf h3{font-size:13px;margin:0 0 4px}
#pdf table{font-size:12px;margin:0}#pdf th,#pdf td{padding:3px 4px}#pdf .st{font-size:22px}#pdf .tl{font-size:15px}#pdf .ph{padding:4px 0 8px}
#pdf .kp{grid-template-columns:repeat(6,1fr);gap:6px}#pdf .kp div{padding:5px 6px}#pdf .kp b{font-size:15px}
#pdf .r2{display:flex;gap:8px;align-items:flex-start}#pdf .r2>div{flex:1;min-width:0}#pdf .sg{margin-top:22px}#pdf .li{padding:3px 0}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}

nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}

<script>
const K='fuelapp1';let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
let fresh=!S;
if(!S)S={pr:{p:0,d:0},m:{},sh:[],cu:[],ex:[]};
if(!S.ow)S.ow=[];
let STOK=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){STOK=false}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('fuelapp',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
async function idbSet(v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'S')}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get('S');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
const save=()=>{const j=JSON.stringify(S);try{localStorage.setItem(K,j)}catch(e){STOK=false}idbSet(j)};
const D=[];for(let i=1;i<=4;i++)D.push({id:'P'+i,t:'p',n:'ماكينة بترول '+i});for(let i=1;i<=2;i++)D.push({id:'D'+i,t:'d',n:'ماكينة ديزل '+i});
const f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const bal=c=>c.tx.reduce((s,t)=>s+(t.k=='w'?t.a:-t.a),0);
const dn=id=>D.find(x=>x.id==id);
let tab='s',cid=null,RD=today(),tt='w',ei=null,xe=null,VS='',mp='set';
const base=()=>window.claude?'https://claude.ai/artifact/MCWWibcQv5N6JF5PUpSn7d':location.href.split('#')[0];
const $=id=>document.getElementById(id);
const fsh=id=>S.ow.find(x=>x.id==id)||S.sh.find(x=>x.id==id);
const mt=id=>dn(id).t;
const tsum=(id,k)=>{let s=0;if(id==null)return 0;S.cu.forEach(c=>c.tx.forEach(t=>{if(t.sid==id&&t.k==k)s+=t.a}));return s};
const crOf=id=>tsum(id,'w'),pyOf=id=>tsum(id,'p');
const num=(id,x='')=>`<input type="number" inputmode="decimal" min="0" step="any" id="${id}" ${x}>`;
function V(){document.getElementById('app').innerHTML=(STOK?'':'<div class="card ban r">تنبيه: المتصفح لا يسمح بحفظ البيانات في هذا الوضع، وقد تضيع عند إغلاق الصفحة. احفظ نسخة احتياطية بانتظام.</div>')+({s:vs,c:vc,x:vx,r:vr,m:vm})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));if(tab=='s')calc();if(tab=='c'&&$('fm'))fillM(true);if(tab=='r')mkqr($('qr'),link(RD),150)}
function go(t){tab=t;cid=null;xe=null;VS='';V()}
/* المبيعات والورديات */
function vs(){
const ow={};S.ow.forEach(o=>o.ms.forEach(i=>ow[i]=o.w));
let h=`<div class="card"><h3>سعر اللتر</h3><div class="row"><label>بترول<input type="number" inputmode="decimal" step="any" value="${S.pr.p||''}" onchange="S.pr.p=+this.value;save();calc()"></label><label>ديزل<input type="number" inputmode="decimal" step="any" value="${S.pr.d||''}" onchange="S.pr.d=+this.value;save();calc()"></label></div></div>`;
h+=`<div class="card"><h3>فتح وردية جديدة</h3><label>اسم العامل<input id="wn"></label><div class="mc">`+D.map(d=>`<label class="ck"><input type="checkbox" class="mk" value="${d.id}" ${ow[d.id]?'disabled':''}> ${d.n}${ow[d.id]?` <small>(${e(ow[d.id])})</small>`:''}</label>`).join('')+`</div><button class="pri" onclick="openS()">فتح الوردية</button></div>`;
S.ow.forEach(o=>{h+=`<div class="card"><h3>وردية ${e(o.w)} <small>${o.d}</small></h3>`;
o.ms.forEach(id=>{const d=dn(id);h+=`<div class="mh"><span class="b ${d.t}">${d.t=='p'?'بترول':'ديزل'}</span> ${d.n}</div>`;
[0,1].forEach(i=>{const k=id+i;h+=`<div class="nz"><b>خرطوم ${i+1}</b><label>السابق<input type="number" inputmode="decimal" min="0" step="any" value="${S.m[k]??''}" onchange="setP('${k}',this)"></label><label>الحالي${num('c'+k,'oninput="calc()" onchange="chkR(\''+k+'\')"')}</label><span class="lt" id="l${k}">0 ل</span></div>`})});
h+=crl(o.id)+`<div class="sum" id="t${o.id}"></div><button class="pri ok" onclick="closeS(${o.id})">قفل الوردية</button><button class="lk neg" onclick="cancelS(${o.id})">إلغاء الوردية</button></div>`});
const t=S.sh.filter(x=>x.d==today());
if(t.length)h+=`<div class="card"><h3>ورديات اليوم المقفلة</h3>`+t.map(x=>`<div class="li"><span>${e(x.w||'—')}<br><small>بترول ${f(x.pl)} ل — ديزل ${f(x.dl)} ل</small></span><b>${f(x.a)}</b></div>`).join('')+'</div>';
return h}
function openS(){const w=wn.value.trim(),ms=[...document.querySelectorAll('.mk:checked')].map(x=>x.value);
if(!w)return alert('اكتب اسم العامل');if(!ms.length)return alert('اختر الماكينات التي استلمها العامل');
S.ow.push({id:Date.now(),w,d:today(),ms});save();V()}
function cancelS(id){if(confirm('إلغاء هذه الوردية بدون حفظ؟')){S.ow=S.ow.filter(x=>x.id!=id);save();V()}}
function crl(id){const r=[];if(id!=null)S.cu.forEach(c=>c.tx.forEach(t=>{if(t.sid==id)r.push([c,t])}));
if(!r.length)return '';return '<div class="mh">حركات العملاء على هذه الوردية</div>'+r.map(([c,t])=>`<div class="li"><span>${e(c.n)}<br><small>${t.k=='w'?'سحب آجل'+(t.m?' — '+dn(t.m).n:''):'سداد مستلم'}</small></span><b>${t.k=='w'?'−':'+'}${f(t.a)}</b></div>`).join('')}
const crLit=(id,ty,ex)=>{let n=0;if(id==null)return 0;S.cu.forEach(c=>c.tx.forEach(t=>{if(t.sid==id&&t.k=='w'&&t.t==ty&&t!==ex)n+=t.l||0}));return n};
function setP(k,el){const v=+el.value;if(el.value===''||v<0){alert('أدخل قراءة صحيحة (لا تقل عن صفر)');el.value=S.m[k]??'';return}S.m[k]=v;save();chkR(k);calc()}
function chkR(k){const el=$('c'+k);if(!el||el.value==='')return;const v=+el.value,p=+S.m[k]||0;if(v<0||v<p){alert(v<0?'قراءة العداد لا يمكن أن تكون سالبة':'قراءة العداد لا يمكن أن تكون أقل من القراءة السابقة ('+f(p)+')');el.value='';calc()}}
function calc(){S.ow.forEach(o=>{const r={p:0,d:0,fp:0,fd:0};
o.ms.forEach(id=>{const t=dn(id).t;[0,1].forEach(i=>{const k=id+i,el=$('c'+k),s=$('l'+k);if(!el)return;const bad=el.value!==''&&+el.value<(+S.m[k]||0),l=el.value===''?0:+el.value-(+S.m[k]||0);s.textContent=f(l)+' ل';s.style.color=bad?'var(--rd)':'';if(el.value!=='')r['f'+t]=1;r[t]+=l})});
const tot=r.p*S.pr.p+r.d*S.pr.d,cr=crOf(o.id),py=pyOf(o.id),cp=crLit(o.id,'p'),cd=crLit(o.id,'d'),low=(r.fp&&r.p<cp)||(r.fd&&r.d<cd),t=$('t'+o.id);
if(t)t.innerHTML=`<div><span>بترول</span><b>${f(r.p)} ل = ${f(r.p*S.pr.p)}</b></div><div><span>ديزل</span><b>${f(r.d)} ل = ${f(r.d*S.pr.d)}</b></div><div><span>إجمالي المبيعات</span><b>${f(tot)}</b></div><div><span>آجل (على حساب العملاء)</span><b>−${f(cr)}</b></div>${py?`<div><span>سداد مستلم</span><b>+${f(py)}</b></div>`:''}<div><span>المطلوب من العامل</span><b>${f(tot-cr+py)}</b></div>${cp||cd?`<div class="${low?'neg':''}"><span>أقل كمية مسموحة (آجل)</span><b>بترول ${f(cp)} ل — ديزل ${f(cd)} ل</b></div>`:''}`})}
function closeS(id){const o=S.ow.find(x=>x.id==id),nz={},ch=[];let pl=0,dl=0;
for(const m of o.ms)for(const i of [0,1]){const k=m+i,v=document.getElementById('c'+k).value,t=dn(m).t;
const op=+S.m[k]||0;
if(v===''){nz[k]={l:0,a:0};continue}
if(+v<op)return alert('القراءة الحالية أقل من السابقة في '+dn(m).n);
const l=+v-op;if(l&&!S.pr[t])return alert('حدد سعر اللتر أولاً');
nz[k]={l,a:l*S.pr[t]};ch.push([k,+v]);if(t=='p')pl+=l;else dl+=l}
if(!ch.length&&!confirm('لم تُدخل أي قراءة عداد، ستُحفظ الوردية بمبيعات صفر. متابعة؟'))return;
const cp=crLit(id,'p'),cd=crLit(id,'d');
if(pl<cp)return alert('كمية البترول المباعة ('+f(pl)+' ل) أقل من البترول الآجل المسجل على هذه الوردية ('+f(cp)+' ل). راجع قراءات العدادات.');
if(dl<cd)return alert('كمية الديزل المباعة ('+f(dl)+' ل) أقل من الديزل الآجل المسجل على هذه الوردية ('+f(cd)+' ل). راجع قراءات العدادات.');
const pa=pl*S.pr.p,da=dl*S.pr.d;
S.sh.push({id,d:o.d,w:o.w,ms:o.ms,pl,dl,pa,da,a:pa+da,nz});ch.forEach(([k,v])=>S.m[k]=v);S.ow=S.ow.filter(x=>x.id!=id);save();V()}
/* العملاء */
const cw=c=>sum(c.tx.filter(t=>t.k=='w'),'a'),cp=c=>sum(c.tx.filter(t=>t.k=='p'),'a');
function vc(){
if(cid){const c=S.cu.find(x=>x.id==cid);if(!c){cid=null;return vc()}
const b=bal(c);
let h=`<button class="lk" onclick="cid=null;ei=null;V()">رجوع للعملاء</button><div class="card"><h3>${e(c.n)}</h3><small>المبلغ المستحق على العميل</small><div class="big ${b>0?'neg':''}">${f(b)}</div><div class="sum"><div><span>إجمالي السحب الآجل</span><b>${f(cw(c))}</b></div><div><span>إجمالي السداد</span><b>${f(cp(c))}</b></div></div><button class="lk" onclick="renC()">تعديل الاسم</button> <button class="lk neg" onclick="delC()">حذف العميل</button></div>`+fform(c);
h+='<div class="card"><h3>كشف الحساب</h3>';
if(!c.tx.length)return h+'<small>لا توجد حركات بعد</small></div>';
const rows=c.tx.map((t,i)=>({t,i})).sort((a,b)=>a.t.d<b.t.d?-1:a.t.d>b.t.d?1:a.i-b.i);let run=0;
h+='<div class="tw"><table><tr><th>التاريخ</th><th>البيان</th><th>سحب</th><th>سداد</th><th>الرصيد</th><th></th></tr>'+rows.map(({t,i})=>{run+=t.k=='w'?t.a:-t.a;const sh=t.sid?fsh(t.sid):null;
const d1=t.k=='w'?'سحب '+(t.t=='p'?'بترول':'ديزل')+(t.l?' '+f(t.l)+' ل':''):'سداد';
const d2=t.k=='w'?(t.m?dn(t.m).n.replace('ماكينة ','')+' — ':'')+(sh?e(sh.w):'—'):(sh?'استلمه '+e(sh.w):'');
return `<tr><td><small>${t.d}</small></td><td>${d1}<br><small>${d2}</small></td><td class="neg">${t.k=='w'?f(t.a):''}</td><td>${t.k=='p'?f(t.a):''}</td><td><b>${f(run)}</b></td><td class="ac"><button class="x" onclick="ei=${i};V();scrollTo(0,0)" aria-label="تعديل">✎</button><button class="x" onclick="dtx(${i})" aria-label="حذف">×</button></td></tr>`}).join('')+'</table></div></div>';

async function bkExport(){
try{await saveFile(`fuel-backup-${today()}.json`,JSON.stringify({v:1,t:new Date().toISOString(),S}));S.bk=today();save();V()}catch(x){if(!x||x.code!='declined')alert('تعذر حفظ الملف'+(x&&x.code?' ('+x.code+')':''))}}
function bkRestore(inp){const fl=inp.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.S||j;if(!d||!d.pr||!Array.isArray(d.sh)||!Array.isArray(d.cu)||!Array.isArray(d.ex))throw 0;

S=d;if(!S.ow)S.ow=[];if(!S.m)S.m={};save();V();alert('تم استرجاع النسخة')}catch(x){alert('الملف غير صالح')}};r.readAsText(fl)}
V();chk();addEventListener('hashchange',chk);
if(fresh)idbGet().then(v=>{try{const d=JSON.parse(v);if(d&&d.pr&&Array.isArray(d.sh)&&!S.sh.length&&!S.cu.length&&!S.ex.length){S=d;if(!S.ow)S.ow=[];if(!S.m)S.m={};V()}}catch(e){}});
